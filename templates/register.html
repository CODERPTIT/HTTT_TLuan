{% extends 'base.html' %}{% block content %}
<section class="auth-panel">
  <span class="eyebrow">ABC ELECTRONICS</span><h1>Create customer account</h1>
  {% if error %}<p role="alert" class="auth-error">{{ error }}</p>{% endif %}
  <form action="/register" method="post" class="stack">
    <label for="name">Full name</label><input id="name" name="name" autocomplete="name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Password (at least 10 characters)</label><input id="password" name="password" type="password" minlength="10" autocomplete="new-password" required>
    <button class="button">Create account</button>
  </form>
  <p>Already have an account? <a href="/login">Sign in</a></p>
</section>
{% endblock %}
